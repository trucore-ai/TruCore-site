name: Test

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

  unit:
    runs-on: ubuntu-latest
    env:
      RECEIPT_SIGNING_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NEXT_PUBLIC_ATF_CLI_VERSION: 0.1.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate ATF manifest
        run: npm run check:atf-manifest

      - name: Enforce pinned CLI quickstart references
        run: |
          if grep -R --line-number "@latest" \
            lib/one-line-quickstart.ts \
            components/single-command-quickstart.tsx \
            app/atf/page.tsx \
            app/docs/5-minute-quickstart/page.tsx \
            app/launch/page.tsx \
            README.md \
            packages/atf-cli/README.md; then
            echo "Disallowed @latest reference found in pinned quickstart surfaces"
            exit 1
          fi

      - name: CLI smoke test
        run: |
          npm run dev > /tmp/trucore-dev.log 2>&1 &
          DEV_PID=$!
          trap "kill $DEV_PID" EXIT

          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done

          node packages/atf-cli/dist/index.js simulate --preset swap_small --base-url http://localhost:3000 --format pretty --verify

      - name: Run tests
        run: npm test -- --run

      - name: Run coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  build:
    runs-on: ubuntu-latest
    env:
      RECEIPT_SIGNING_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      ADMIN_DASHBOARD_KEY: ${{ secrets.ADMIN_DASHBOARD_KEY }}
      RECEIPT_SIGNING_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      ATF_E2E_TEST_SECRET: ${{ secrets.ATF_E2E_TEST_SECRET }}
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests (includes admin auth flow)
        run: npm run test:e2e

      - name: Upload Playwright report artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
